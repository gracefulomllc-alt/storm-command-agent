<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Good Knight — Today</title>
<style>
  :root { --bg:#0b1220; --panel:#131c2e; --border:#233049; --text:#e8edf6; --muted:#8a99b5; --brass:#d6b031; --blue:#2563eb; --green:#22c55e; --red:#ef4444; }
  * { box-sizing: border-box; }
  body { font-size:17px; margin:0; background:var(--bg); color:var(--text); font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; padding: 20px 16px 60px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 6px 0 2px; }
  .date { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 26px; }
  a.tile { display:flex; flex-direction:column; justify-content:space-between; min-height: 190px; padding: 20px; border-radius: 14px; background: var(--panel); border:1px solid var(--border); color:var(--text); text-decoration:none; transition: transform .1s, border-color .1s; }
  a.tile:hover, a.tile:focus-visible { border-color: var(--brass); transform: translateY(-2px); outline: none; }
  .tile .icon { font-size: 34px; }
  .tile .label { font-size: 26px; font-weight: 700; margin-top: 8px; }
  .tile .head { font-size: 17px; color: var(--muted); margin-top: 6px; line-height: 1.35; }
  .tile .head b { color: var(--text); }
  .tile.storm { border-left: 5px solid var(--red); }
  .tile.nums { border-left: 5px solid var(--green); }
  .tile.team { border-left: 5px solid var(--blue); }
  .tile.desk { border-left: 5px solid var(--brass); }
  h2 { font-size: 16px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; }
  .strip { background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 4px 16px; }
  .strip a { display:flex; gap: 12px; align-items:flex-start; padding: 16px 0; border-top: 1px solid var(--border); color: var(--text); text-decoration:none; font-size: 17px; }
  .strip a:first-child { border-top: none; }
  .strip .dot { flex:none; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
  .dot.go { background: var(--red); } .dot.ok { background: var(--green); } .dot.todo { background: var(--brass); }
  .strip small { display:block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .card h3 { margin: 0 0 8px; font-size: 19px; }
  .spot { padding: 12px 0; border-top: 1px solid var(--border); }
  .spot:first-of-type { border-top: none; }
  .spot .addr { font-size: 17px; font-weight: 600; }
  .spot .why { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .badge { display:inline-block; min-width: 44px; text-align:center; padding: 3px 8px; border-radius: 8px; font-weight: 800; margin-right: 8px; }
  .badge.go { background: var(--green); color:#042a0f; } .badge.maybe { background: var(--brass); color:#1a1300; }
  .assign { font-size: 14px; color: var(--muted); padding: 4px 0; }
  .qbtn { display:block; width:100%; text-align:left; background: #0f1829; color: var(--text); border:1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 16px; margin-top: 8px; cursor:pointer; }
  .qbtn:active { border-color: var(--brass); }
  .go-btn { width:100%; margin-top: 12px; padding: 15px; font-size: 16px; font-weight: 700; border:none; border-radius: 10px; background: var(--blue); color:#fff; cursor:pointer; }
  .src { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .foot { text-align:center; margin-top: 24px; font-size: 13px; }
  .foot a { color: var(--muted); margin: 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Good Knight Command</h1>
  <div class="date" id="date"></div>

  <div class="tiles">
    <a class="tile storm" href="/storms.html">
      <div><div class="icon">⛈️</div><div class="label">Storms</div></div>
      <div class="head" id="hStorm">Loading…</div>
    </a>
    <a class="tile nums" href="/desk.html#today">
      <div><div class="icon">📊</div><div class="label">Check numbers</div></div>
      <div class="head" id="hNums">Loading…</div>
    </a>
    <a class="tile team" href="/team.html">
      <div><div class="icon">👥</div><div class="label">My team</div></div>
      <div class="head" id="hTeam">Loading…</div>
    </a>
    <a class="tile desk" href="/desk.html#checklist">
      <div><div class="icon">🗂️</div><div class="label">Manager Desk</div></div>
      <div class="head" id="hDesk">Loading…</div>
    </a>
  </div>

  <a class="tile" href="/storms.html#history" style="min-height:0;flex-direction:row;align-items:center;gap:14px;margin-bottom:26px;padding:16px 20px"><span class="icon" style="font-size:28px">🕘</span><span><b style="font-size:19px">Check a past storm</b><div class="head" style="margin-top:2px">Is an area worth sending the team? Pick dates and circle it.</div></span></a>

  <div class="card" id="qCard" style="display:none"></div>
  <div class="card" id="planCard"><h3>Best spots to send the team</h3><div class="why" style="color:var(--muted)">Checking storm sources…</div></div>

  <h2>Today</h2>
  <div class="strip" id="strip"><a href="#"><span class="dot"></span><span>Loading…</span></a></div>

  <div class="foot"><a href="/rep.html">Rep check-in page</a></div>
</div>

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = c => { const d=(c||0)/100; return d>=1e6?'$'+(d/1e6).toFixed(2)+'M':d>=1e3?'$'+Math.round(d/1e3)+'k':'$'+Math.round(d); };
const pad = n => (n<10?'0':'')+n;
const today = new Date();
const key = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
document.getElementById('date').textContent = today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const j = (u) => fetch(u).then(r => r.ok ? r.json() : Promise.reject(new Error(u)));

const DAILY_IDS = ['d1','d2','d3','d4','d5','d6'];

async function load() {
  const [storms, reps, rev, pulse, checks, cfg] = await Promise.all([
    j('/api/storms').catch(() => null),
    j('/api/coach').catch(() => null),
    j('/api/revenue').catch(() => null),
    j('/api/desk?path=pulse/' + key).catch(() => null),
    j('/api/desk?path=gk/checks').catch(() => null),
    j('/api/desk?path=gk/cfg').catch(() => null),
  ]);
  const strip = [];

  // Storms
  const list = (storms && storms.storms) || [];
  if (storms) {
    if (list.length) {
      const top = list[0];
      document.getElementById('hStorm').innerHTML = `<b>Start here:</b><br>${esc(top.startAddress)}`;
      strip.push({ cls:'go', href:'/storms.html', t:`Start here: ${esc(top.startAddress)}`, s:`Score ${top.claim.score} · ${esc(top.counties)}${top.size ? ' · '+top.size+'" hail' : ''}` });
    } else {
      document.getElementById('hStorm').textContent = 'No qualifying hail right now';
      strip.push({ cls:'ok', href:'/storms.html', t:'No qualifying storms right now', s:'The agent rescans every 15 minutes and emails you when one hits.' });
    }
  } else document.getElementById('hStorm').textContent = 'Tap to open the map';

  // Numbers
  const snap = rev && rev.snapshot;
  const goalCents = (rev && rev.goals && rev.goals.totalCents) || 300000000;
  const sold = snap ? snap.total_sold_cents : 0;
  document.getElementById('hNums').innerHTML = `<b>${money(sold)}</b> of ${money(goalCents)} goal`;
  if (pulse && pulse.data) strip.push({ cls:'ok', href:'/desk.html#today', t:'Daily pulse logged', s:`${pulse.data.doors||0} doors · ${pulse.data.appts||0} appointments` });
  else strip.push({ cls:'todo', href:'/desk.html#today', t:'Log today\'s team pulse', s:'Doors, appointments set and cash collected.' });

  // Team
  if (reps && reps.reps) {
    const rs = reps.reps;
    const flagged = rs.filter(r => ['decision','warning','coach'].includes(r.level));
    const decision = rs.filter(r => r.level === 'decision').length;
    document.getElementById('hTeam').innerHTML = rs.length
      ? `<b>${rs.length}</b> reps · ${flagged.length ? `<b>${flagged.length} need attention</b>` : 'all on track'}`
      : 'No reps yet. Hiring starts Jan 1';
    if (flagged.length) strip.push({ cls: decision ? 'go' : 'todo', href:'/team.html', t:`${flagged.length} rep${flagged.length === 1 ? '' : 's'} need${flagged.length === 1 ? 's' : ''} attention`, s: flagged.slice(0,3).map(r => r.name + ': ' + r.label.toLowerCase()).join(' · ') });
  } else document.getElementById('hTeam').textContent = 'Tap to see your reps';

  // Desk
  const map = (checks && checks.data && checks.data.map) || {};
  const left = DAILY_IDS.filter(id => !map[id]).length;
  const startStr = (cfg && cfg.data && cfg.data.start) || '2027-01-04';
  const days = Math.ceil((new Date(startStr + 'T00:00:00') - today) / 86400000);
  document.getElementById('hDesk').innerHTML = days > 0 ? `Season opens in <b>${days} days</b>` : `<b>${left}</b> daily items left`;
  strip.push({ cls: left ? 'todo':'ok', href:'/desk.html#checklist', t: left ? `${left} of ${DAILY_IDS.length} daily checklist items open` : 'Daily checklist done', s:'Huddle, SalesRabbit check, appointments, new signed jobs.' });

  document.getElementById('strip').innerHTML = strip.map(x =>
    `<a href="${x.href}"><span class="dot ${x.cls}"></span><span>${x.t}<small>${x.s}</small></span></a>`).join('');
}

let PLAN = null;
async function loadPlan() {
  const card = document.getElementById('planCard');
  try {
    PLAN = await j('/api/plan?days=14');
  } catch (e) { card.innerHTML = '<h3>Best spots to send the team</h3><div class="why" style="color:var(--muted)">Could not check storm sources right now.</div>'; return; }
  const spots = PLAN.spots || [];
  const src = (PLAN.statuses || []).map(s => `${s.ok ? '✓' : '✗'} ${esc(s.name)}`).join(' · ');
  let html = '<h3>Best spots to send the team</h3>';
  if (!spots.length) html += '<div class="why" style="color:var(--muted)">Nothing worth chasing in the last 14 days. Skip the drive and work referrals or old leads.</div>';
  html += spots.slice(0, 3).map(s => `<div class="spot"><div class="addr"><span class="badge ${s.verdict}">${s.score}/10</span>${esc(s.address)}</div><div class="why">${s.maxHail}" hail · ${s.count} report${s.count === 1 ? '' : 's'} · checked by ${s.venues.map(esc).join(' + ')}</div></div>`).join('');
  if (PLAN.assignments && PLAN.assignments.length) {
    html += '<div style="margin-top:10px"><b>Suggested plan</b></div>' + PLAN.assignments.map(a => `<div class="assign">${esc(a.name)} → ${esc(a.address)}</div>`).join('');
    html += '<button class="go-btn" onclick="approvePlan()">Approve and send reps</button>';
  } else if (spots.length) {
    html += '<div class="src">No reps on the roster yet, so nobody to assign. Add reps once hiring starts.</div>';
  }
  html += `<div class="src">Sources: ${src}</div>`;
  card.innerHTML = html;
}
async function approvePlan() {
  if (!PLAN || !PLAN.assignments) return;
  if (!confirm(`Send ${PLAN.assignments.length} rep(s) to their spots?`)) return;
  const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'approve', assignments: PLAN.assignments.map(a => ({ repId: a.repId, address: a.address })) }) });
  const d = await r.json();
  alert(r.ok ? 'Reps sent. They will see their address on the check-in page.' : (d.error || 'Did not send'));
}
async function loadBrief() {
  const card = document.getElementById('qCard');
  try {
    const b = await j('/api/brief');
    const p = b.pace;
    let line = '';
    if (p) line = p.pre ? `Season opens in ${p.daysToStart} days. Must-hit $${(p.goal/1e6).toFixed(1)}M, stretch $${(p.stretch/1e6).toFixed(1)}M.`
      : `${p.onPace ? 'Ahead of' : 'Behind'} the $${(p.goal/1e6).toFixed(1)}M pace by $${Math.round(Math.abs(p.gap)).toLocaleString()}.`;
    if (!b.question) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    card.innerHTML = `<h3>${esc(b.question.text)}</h3><div class="why" style="color:var(--muted);font-size:14px">${esc(line)}</div>` +
      b.question.options.map(o => `<button class="qbtn" data-k="${b.question.key}" data-o="${esc(o)}">${esc(o)}</button>`).join('');
    card.querySelectorAll('.qbtn').forEach(btn => btn.onclick = async () => {
      await fetch('/api/brief', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: btn.dataset.k, answer: btn.dataset.o }) });
      card.innerHTML = '<h3>Thanks, got it.</h3>';
      setTimeout(() => card.style.display = 'none', 1800);
    });
  } catch (e) { card.style.display = 'none'; }
}
loadPlan(); loadBrief();
load();
setInterval(load, 60000);
setInterval(loadPlan, 15 * 60000);
</script>
</body>
</html>
