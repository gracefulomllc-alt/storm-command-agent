<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Storm Command — Good Knight Roofing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2b;
    --border: #2a3a52;
    --text: #eaf2ff;
    --muted: #9fb3cc;
    --blue: #2563eb;
    --high: #ef4444;
    --mid: #f59e0b;
    --low: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0f1830, #0b1220);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  #status { font-size: 12px; color: var(--muted); }
  .goal-bars { display: flex; gap: 18px; }
  .goal-bar { width: 160px; }
  .goal-bar .label { font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 3px; }
  .goal-bar .track { height: 6px; background: #1c2840; border-radius: 4px; overflow: hidden; }
  .goal-bar .fill { height: 100%; background: linear-gradient(90deg, #2563eb, #22c55e); }
  main {
    display: grid;
    grid-template-columns: minmax(340px, 420px) 1fr;
    height: calc(100vh - 94px);
  }
  #cards {
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 12px;
  }
  #map { height: 100%; position: relative; }
  .pane-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .pane-tabs button { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .pane-tabs button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .map-controls { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
  .map-controls button { background: rgba(17,26,43,0.92); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .map-controls button.active { background: var(--blue); border-color: var(--blue); }
  .rep-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .rep-card .name-row { display: flex; justify-content: space-between; align-items: center; }
  .rep-card .name { font-weight: 700; }
  .rep-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
  .rep-status.idle { background: #27344a; color: var(--muted); }
  .rep-status.dispatched { background: #1d4ed8; color: #fff; }
  .rep-status.on_site { background: #f59e0b; color: #1a1300; }
  .rep-status.done { background: #22c55e; color: #042a0f; }
  .rep-card .addr { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .rep-card .stats { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  .rep-card .stale { color: #ef4444; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .score-badge {
    font-size: 20px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    color: #fff;
  }
  .score-badge.high { background: var(--high); }
  .score-badge.medium { background: var(--mid); }
  .score-badge.low { background: var(--low); }
  .tier-label { font-size: 13px; color: var(--muted); }
  .heart-addr {
    font-size: 16px;
    font-weight: 700;
    margin: 6px 0;
    line-height: 1.3;
  }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn.secondary { background: #27344a; }
  .source-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  #empty, #teamEmpty { padding: 30px; color: var(--muted); text-align: center; }
  .hidden { display: none; }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  .hist label { display:block; font-size:12px; color: var(--muted); margin: 10px 0 4px; }
  .hist select, .hist input { width:100%; background:#0b1220; color: var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-size:16px; }
  .hist input[type=range] { padding:0; }
  .hist .hint { font-size:12px; color: var(--muted); margin-top:8px; }
  .hist .go-btn { width:100%; margin-top:14px; padding:14px; font-size:15px; }
  .hist-result { margin-top:14px; }
  .big-score { display:flex; align-items:center; gap:14px; }
  .big-score .num { font-size:44px; font-weight:800; line-height:1; }
  .big-score .of { font-size:16px; color: var(--muted); }
  .verdict { display:inline-block; padding:4px 12px; border-radius:12px; font-weight:700; font-size:13px; text-transform:uppercase; }
  .verdict.go { background:#22c55e; color:#042a0f; } .verdict.maybe { background:#f59e0b; color:#1a1300; } .verdict.skip { background:#ef4444; color:#fff; }
  .hist-result ul { padding-left: 18px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .hist-result li { margin-bottom: 6px; }
  .hist-result .pct { font-size:15px; margin-top:6px; }
  @media (max-width: 800px) {
    .pane-tabs button { padding: 14px 6px; font-size: 14px; }
    .card, .rep-card { font-size: 15px; }
    .btn { padding: 12px 16px; font-size: 14px; }
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    header .sub, .goal-bars { display: none; }
    main { display: flex; flex-direction: column; height: auto; }
    #map { order: -1; height: 55vh; min-height: 320px; flex: none; }
    body.bigmap #map { height: 82vh; }
    body.bigmap #cards { display: none; }
    #cards { border-right: none; border-top: 1px solid var(--border); overflow: visible; }
    .map-controls button { padding: 10px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>⚡ Storm Command</h1>
    <div class="sub">Good Knight Roofing — Northern Colorado / Wyoming</div>
  </div>
  <div class="goal-bars">
    <div class="goal-bar">
      <div class="label"><span>Total</span><span id="goalTotalLabel">$0 / $5.0M</span></div>
      <div class="track"><div class="fill" id="goalTotalFill" style="width:0%"></div></div>
    </div>
    <div class="goal-bar">
      <div class="label"><span>Canvasser</span><span id="goalCanvasserLabel">$0 / $1.0M</span></div>
      <div class="track"><div class="fill" id="goalCanvasserFill" style="width:0%"></div></div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="status">Loading…</span>
    <a class="refresh-btn" href="/" style="text-decoration:none;">⌂ Home</a>
        <button class="refresh-btn" onclick="load(true)">Refresh</button>
  </div>
</header>
<main>
  <div id="cards">
    <div class="pane-tabs">
      <button id="tabStorms" class="active" onclick="switchPane('storms')">⚡ Storms</button>
      <button id="tabTeam" onclick="switchPane('team')">👥 Team</button>
      <button id="tabHistory" onclick="switchPane('history')">🕘 Past storms</button>
    </div>
    <div id="stormsPane"><div id="empty">Loading storms…</div></div>
    <div id="teamPane" class="hidden"><div id="teamEmpty">Loading team…</div></div>
    <div id="historyPane" class="hidden hist card">
      <b>Past storms: is this area worth canvassing?</b>
      <label for="histRange">When did the storm happen?</label>
      <select id="histRange" onchange="histRangeChanged()"></select>
      <div id="histCustom" class="hidden">
        <label for="histFrom">From</label><input type="date" id="histFrom">
        <label for="histTo">To</label><input type="date" id="histTo">
      </div>
      <label for="histRadius">Circle size: <span id="histRadiusLabel">10</span> miles</label>
      <input type="range" id="histRadius" min="2" max="40" value="10" oninput="histRadiusChanged()">
      <div class="hint" id="histHint">Tap the map to drop a circle on the area. If you don't, I'll score whatever the map is showing.</div>
      <div class="btn-row" style="margin-top:10px"><button class="btn secondary" onclick="clearHistCircle()">Clear circle</button></div>
      <button class="btn go-btn" onclick="scoreHistory()">Score this area</button>
      <div class="hist-result" id="histResult"></div>
    </div>
  </div>
  <div id="map">
    <div class="map-controls">
      <button id="btnStreets" onclick="toggleStreets()">Dark map</button>
      <button id="btnRadar" onclick="toggleRadar()">Radar overlay</button>
      <button id="btnBig" onclick="toggleBig()">Bigger map</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', { renderer: L.canvas(), attributionControl: true }).setView([40.5, -104.9], 7);
L.control.attribution({ prefix: false }).addAttribution('&copy; OpenStreetMap contributors &copy; Esri &copy; NOAA/Iowa Environmental Mesonet').addTo(map);

let markers = [];

function sourceLabel(src) {
  return {
    'confirmed-spotter': '✅ Confirmed hail report',
    'tracked-cell': '📍 NWS-tracked storm position',
    'polygon-estimate': '🔵 Estimated storm center',
  }[src] || 'Unknown';
}

function directionsUrl(pt) {
  if (!pt) return '#';
  return `https://www.google.com/maps/dir/?api=1&destination=${pt.lat},${pt.lon}`;
}

function render(storms) {
  const cardsEl = document.getElementById('stormsPane');
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  if (!storms.length) {
    cardsEl.innerHTML = '<div id="empty">No active storms meeting the 1"+ hail threshold right now. Check back — the agent scans every 15 minutes.</div>';
    return;
  }

  cardsEl.innerHTML = storms.map(s => `
    <div class="card">
      <div class="score-row">
        <div class="score-badge ${s.claim.tier}">${s.claim.score}</div>
        <div class="tier-label">${s.claim.tierLabel} · ${s.region === 'primary' ? 'Home turf' : 'Corridor'}</div>
      </div>
      <div class="heart-addr">🎯 ${s.startAddress}</div>
      <div class="source-tag">${sourceLabel(s.targetSource)}</div>
      <div class="meta">${s.counties}${s.size ? ` · ${s.size}" hail` : ''}${s.windMph ? ` · ${s.windMph} mph wind` : ''} · top factor: ${s.claim.topFactor}</div>
      <div class="btn-row">
        <a class="btn" href="${directionsUrl(s.targetPoint)}" target="_blank">Directions</a>
        <button class="btn secondary" onclick="copyAddr('${s.startAddress.replace(/'/g, "\\'")}')">Copy Address</button>
      </div>
    </div>
  `).join('');

  storms.forEach(s => {
    if (!s.targetPoint) return;
    const color = s.claim.tier === 'high' ? '#ef4444' : s.claim.tier === 'medium' ? '#f59e0b' : '#64748b';
    const marker = L.circleMarker([s.targetPoint.lat, s.targetPoint.lon], {
      radius: 9, color, fillColor: color, fillOpacity: 0.85, weight: 2,
    }).addTo(map).bindPopup(`<b>${s.claim.score}/100</b><br>${s.startAddress}`);
    markers.push(marker);
  });
}

function copyAddr(addr) {
  navigator.clipboard?.writeText(addr);
}

async function load(forceRefresh) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Scanning…';
  try {
    const url = forceRefresh ? '/api/storms?refresh=1' : '/api/storms';
    const res = await fetch(url);
    const data = await res.json();
    render(data.storms || []);
    const counts = data.counts || {};
    statusEl.textContent = `Updated ${new Date(data.scannedAt).toLocaleTimeString()} · CO:${counts.CO ?? '?'} WY:${counts.WY ?? '?'} active`;
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

// --- Pane switching (Storms / Team) ---
function switchPane(which) {
  const ids = { storms: ['tabStorms','stormsPane'], team: ['tabTeam','teamPane'], history: ['tabHistory','historyPane'] };
  for (const k in ids) {
    document.getElementById(ids[k][0]).classList.toggle('active', k === which);
    document.getElementById(ids[k][1]).classList.toggle('hidden', k !== which);
  }
  currentPane = which;
  if (which !== 'history') clearHistMarkers();
}
let currentPane = 'storms';
let histCircle = null, histMarkers = [];

function toggleBig() {
  const on = document.body.classList.toggle('bigmap');
  document.getElementById('btnBig').textContent = on ? 'Show list' : 'Bigger map';
  document.getElementById('btnBig').classList.toggle('active', on);
  setTimeout(() => map.invalidateSize(), 50);
}

if (location.hash === '#team') switchPane('team');
if (location.hash === '#history') switchPane('history');

// --- Team roster + live GPS dots ---
let repMarkers = [];
const STATUS_LABEL = { idle: 'Idle', dispatched: 'Dispatched', on_site: 'On Site', done: 'Done' };

function renderTeam(reps) {
  const el = document.getElementById('teamPane');
  repMarkers.forEach(m => map.removeLayer(m));
  repMarkers = [];

  if (!reps.length) {
    el.innerHTML = '<div id="teamEmpty">No reps added yet. Add them via the /api/reps endpoint or ask Claude to add a quick admin form.</div>';
    return;
  }

  el.innerHTML = reps.map(r => {
    const staleMin = r.location_updated_at ? Math.round((Date.now() - new Date(r.location_updated_at).getTime()) / 60000) : null;
    return `
    <div class="rep-card">
      <div class="name-row">
        <span class="name">${r.name}</span>
        <span class="rep-status ${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
      </div>
      <div class="addr">${r.assigned_address || 'No turf assigned'}</div>
      <div class="stats">
        <span>🚪 ${r.doors_knocked} doors</span>
        <span>📅 ${r.appointments_set} appts</span>
        <span class="${staleMin !== null && staleMin > 30 ? 'stale' : ''}">${staleMin !== null ? `📍 ${staleMin}m ago` : '📍 no location yet'}</span>
      </div>
    </div>`;
  }).join('');

  reps.forEach(r => {
    if (r.lat == null || r.lon == null) return;
    const icon = L.divIcon({ className: '', html: `<div style="background:#2563eb;border:2px solid #fff;border-radius:50%;width:16px;height:16px;"></div>` });
    const marker = L.marker([r.lat, r.lon], { icon }).addTo(map).bindPopup(`<b>${r.name}</b><br>${STATUS_LABEL[r.status]}`);
    repMarkers.push(marker);
  });
}

async function loadTeam() {
  try {
    const res = await fetch('/api/reps');
    const reps = await res.json();
    renderTeam(reps);
  } catch (err) {
    document.getElementById('teamPane').innerHTML = `<div id="teamEmpty">Error loading team: ${err.message}</div>`;
  }
}

// --- Revenue goal bars ---
function fmtMoney(cents) {
  const dollars = (cents || 0) / 100;
  if (dollars >= 1_000_000) return `$${(dollars / 1_000_000).toFixed(2)}M`;
  if (dollars >= 1_000) return `$${(dollars / 1000).toFixed(0)}k`;
  return `$${dollars.toFixed(0)}`;
}

async function loadRevenue() {
  try {
    const res = await fetch('/api/revenue');
    const data = await res.json();
    const snap = data.snapshot || { total_sold_cents: 0, canvasser_sold_cents: 0 };
    const goals = data.goals || { totalCents: 500000000, canvasserCents: 100000000 };
    const totalPct = Math.min(100, (snap.total_sold_cents / goals.totalCents) * 100);
    const canvPct = Math.min(100, (snap.canvasser_sold_cents / goals.canvasserCents) * 100);
    document.getElementById('goalTotalFill').style.width = `${totalPct}%`;
    document.getElementById('goalCanvasserFill').style.width = `${canvPct}%`;
    document.getElementById('goalTotalLabel').textContent = `${fmtMoney(snap.total_sold_cents)} / ${fmtMoney(goals.totalCents)}`;
    document.getElementById('goalCanvasserLabel').textContent = `${fmtMoney(snap.canvasser_sold_cents)} / ${fmtMoney(goals.canvasserCents)}`;
  } catch {
    // Revenue is best-effort (needs CRM keys configured) — fail quietly, keep bars at 0.
  }
}

// --- Basemap / radar toggles ---
// Default is OpenStreetMap street map (clearest on a phone). "Dark map" switches to Esri dark gray.
let darkOn = false;
let radarOn = false;
let radarLayer = null;
let radarTimer = null;
const streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
const darkBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 });
const darkLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 });

function toggleStreets() {
  darkOn = !darkOn;
  document.getElementById('btnStreets').classList.toggle('active', darkOn);
  document.getElementById('btnStreets').textContent = darkOn ? 'Street map' : 'Dark map';
  if (darkOn) { map.removeLayer(streetLayer); darkBase.addTo(map); darkLabels.addTo(map); }
  else { map.removeLayer(darkBase); map.removeLayer(darkLabels); streetLayer.addTo(map); }
  if (radarLayer) radarLayer.bringToFront();
}

// NOAA NEXRAD radar via Iowa State Mesonet (free, no key), refreshed every 2 minutes while on.
function radarUrl() {
  return 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?t=' + Math.floor(Date.now() / 120000);
}
function toggleRadar() {
  radarOn = !radarOn;
  document.getElementById('btnRadar').classList.toggle('active', radarOn);
  if (!radarOn) {
    if (radarLayer) map.removeLayer(radarLayer);
    radarLayer = null;
    clearInterval(radarTimer);
    return;
  }
  radarLayer = L.tileLayer(radarUrl(), { opacity: 0.6, zIndex: 500 }).addTo(map);
  radarTimer = setInterval(() => { if (radarLayer) radarLayer.setUrl(radarUrl()); }, 120000);
}


// --- Storm history scoring ---
const pad2 = n => String(n).padStart(2, '0');
const localYmd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

function buildRangeOptions() {
  const sel = document.getElementById('histRange');
  const now = new Date();
  let html = '<option value="30d">Last 30 days</option>';
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    html += `<option value="m:${d.getFullYear()}-${pad2(d.getMonth() + 1)}">${d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</option>`;
  }
  html += '<option value="custom">Pick exact dates…</option>';
  sel.innerHTML = html;
  const t = localYmd(now);
  document.getElementById('histTo').value = t;
  document.getElementById('histFrom').value = localYmd(new Date(now.getTime() - 14 * 86400000));
}
function histRangeChanged() {
  document.getElementById('histCustom').classList.toggle('hidden', document.getElementById('histRange').value !== 'custom');
}
function histDates() {
  const v = document.getElementById('histRange').value;
  const now = new Date();
  if (v === '30d') return { from: localYmd(new Date(now.getTime() - 30 * 86400000)), to: localYmd(now) };
  if (v.startsWith('m:')) {
    const [y, m] = v.slice(2).split('-').map(Number);
    const last = new Date(y, m, 0);
    return { from: `${y}-${pad2(m)}-01`, to: localYmd(last > now ? now : last) };
  }
  return { from: document.getElementById('histFrom').value, to: document.getElementById('histTo').value };
}
function histRadiusMi() { return Number(document.getElementById('histRadius').value); }
function histRadiusChanged() {
  document.getElementById('histRadiusLabel').textContent = histRadiusMi();
  if (histCircle) histCircle.setRadius(histRadiusMi() * 1609.34);
}
function clearHistMarkers() { histMarkers.forEach(m => map.removeLayer(m)); histMarkers = []; }
function clearHistCircle() {
  if (histCircle) { map.removeLayer(histCircle); histCircle = null; }
  clearHistMarkers();
  document.getElementById('histHint').textContent = "Tap the map to drop a circle on the area. If you don't, I'll score whatever the map is showing.";
}
map.on('click', e => {
  if (currentPane !== 'history') return;
  if (histCircle) histCircle.setLatLng(e.latlng);
  else histCircle = L.circle(e.latlng, { radius: histRadiusMi() * 1609.34, color: '#2563eb', weight: 2, fillOpacity: 0.12 }).addTo(map);
  document.getElementById('histHint').textContent = 'Circle placed. Tap again to move it, or change the size with the slider.';
});

async function scoreHistory() {
  const out = document.getElementById('histResult');
  const { from, to } = histDates();
  if (!from || !to || from > to) { out.innerHTML = '<div class="meta">Pick a valid date range first.</div>'; return; }
  let center, radius;
  if (histCircle) {
    center = histCircle.getLatLng(); radius = histRadiusMi();
  } else {
    center = map.getCenter();
    const b = map.getBounds();
    const halfW = map.distance(b.getNorthWest(), b.getNorthEast()) / 2;
    const halfH = map.distance(b.getNorthWest(), b.getSouthWest()) / 2;
    radius = Math.min(60, Math.max(2, Math.min(halfW, halfH) / 1609.34));
  }
  out.innerHTML = '<div class="meta">Checking storm reports…</div>';
  clearHistMarkers();
  try {
    const q = new URLSearchParams({ from, to, lat: center.lat, lon: center.lng, radius: radius.toFixed(1) });
    const res = await fetch('/api/history?' + q);
    const d = await res.json();
    if (!res.ok) { out.innerHTML = `<div class="meta">${d.error || 'Something went wrong.'}</div>`; return; }
    const verdictText = { go: 'Worth sending canvassers', maybe: 'Borderline: scout first', skip: 'Not worth the drive' }[d.verdict];
    out.innerHTML = `
      <div class="big-score"><div><span class="num">${d.score}</span><span class="of">/10</span></div>
        <div><span class="verdict ${d.verdict}">${d.verdictLabel}</span><div class="pct"><b>~${d.approvalPct}%</b> estimated approval likelihood</div></div></div>
      <div class="meta" style="margin-top:8px">${verdictText} · ${Math.round(d.radiusMi)} mi circle · ${d.from} to ${d.to}</div>
      <ul>${d.reasons.map(r => `<li>${r}</li>`).join('')}</ul>
      ${d.daysFailed ? `<div class="meta" style="margin-top:8px;color:#f59e0b">${d.daysFailed} of ${d.daysChecked} days couldn't be loaded, so this may undercount.</div>` : ''}
      <div class="meta" style="margin-top:8px">Estimate only, based on storm reports. It is not a guarantee of approval.</div>`;
    d.reports.forEach(r => {
      const sz = r.sizeInches;
      const color = sz >= 1.75 ? '#ef4444' : sz >= 1.0 ? '#f59e0b' : '#94a3b8';
      const m = L.circleMarker([r.lat, r.lon], { radius: 4 + sz * 3, color, fillColor: color, fillOpacity: 0.8, weight: 1 })
        .addTo(map).bindPopup(`<b>${sz}" hail</b><br>${r.date}<br>${r.location}, ${r.county} Co. ${r.state}`);
      histMarkers.push(m);
    });
    const ring = L.circle([d.center.lat, d.center.lon], { radius: d.radiusMi * 1609.34, color: '#2563eb', weight: 1, fill: false, dashArray: '4 4' }).addTo(map);
    histMarkers.push(ring);
    map.fitBounds(ring.getBounds(), { padding: [20, 20] });
  } catch (err) {
    out.innerHTML = `<div class="meta">Error: ${err.message}</div>`;
  }
}
buildRangeOptions();

load(false);
loadTeam();
loadRevenue();
setInterval(() => load(false), 45 * 1000); // storms refresh every 45s — near-real-time without hammering the API
setInterval(loadTeam, 20 * 1000); // team/GPS refresh every 20s
setInterval(loadRevenue, 5 * 60 * 1000); // revenue every 5 min (CRM pulls are heavier)
</script>
</body>
</html>
